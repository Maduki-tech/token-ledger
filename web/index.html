<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Ledger</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s7: #6250d6;
  --other: #b5b4ad; --critical: #d03b3b; --good: #0ca30c;
  --seq-in: #9ec5f4; --seq-out: #2a78d6; --seq-cw: #184f95; --seq-cr: #cde2fb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s7: #9085e9;
    --other: #5c5b57; --seq-in: #3987e5; --seq-out: #86b6ef; --seq-cw: #cde2fb; --seq-cr: #184f95;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s7: #9085e9;
  --other: #5c5b57; --seq-in: #3987e5; --seq-out: #86b6ef; --seq-cw: #cde2fb; --seq-cr: #184f95;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.mono { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 12.5px; }
a { color: inherit; }
header { position: sticky; top: 0; z-index: 5; background: var(--page);
  border-bottom: 1px solid var(--ring); }
.bar { max-width: 1280px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px;
  align-items: center; flex-wrap: wrap; }
.brand { font-weight: 650; letter-spacing: -0.01em; }
.crumbs { color: var(--ink-2); display: flex; gap: 6px; align-items: center; min-width: 0; }
.crumbs a { text-decoration: none; } .crumbs a:hover { text-decoration: underline; }
.crumbs span.cur { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink-2); padding: 5px 11px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--ring); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.live { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.dot.pulse { animation: pulse 0.9s ease-out; }
.dot.off { background: var(--critical); }
@keyframes pulse { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); }
  to { box-shadow: 0 0 0 8px transparent; } }
@media (prefers-reduced-motion: reduce) { .dot.pulse { animation: none; } }
main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; min-width: 0; }
.avatar { display: inline-grid; place-items: center; flex: none; width: var(--sz); height: var(--sz); border-radius: calc(var(--sz) * 0.26);
  overflow: hidden; vertical-align: middle; background: var(--surface); box-shadow: inset 0 0 0 1px var(--ring); }
.avatar img { width: 100%; height: 100%; object-fit: contain; padding: 12%; }
.avatar.mono { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 650; font-size: calc(var(--sz) * 0.4); letter-spacing: -0.02em; line-height: 1; }
.namecell { display: inline-flex; gap: 8px; align-items: center; vertical-align: middle; }
.cardhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.cardhead h2 { margin: 0; }
.pgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .pgrid { grid-template-columns: 1fr; } }
.pcard { display: block; text-decoration: none; border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.pcard:hover { background: var(--hover); }
.pcard:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcwd { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.pcost { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin: 10px 0 6px; }
.pstats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.card h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 12px 14px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tile .s { color: var(--ink-2); font-size: 12px; }
.title h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
.title .sub { color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
.title blockquote { margin: 10px 0 0; padding: 8px 12px; border-left: 3px solid var(--axis); color: var(--ink-2);
  white-space: pre-wrap; max-height: 8em; overflow: auto; }
.scroll { overflow-x: auto; overflow-y: hidden; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 8px;
  border-bottom: 1px solid var(--axis); white-space: nowrap; cursor: default; user-select: none; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--ink); }
td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td, tr.sel td { background: var(--hover); }
tr.click:focus-visible { outline: 2px solid var(--s1); outline-offset: -2px; }
td.t { max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.barcell { width: 22%; min-width: 80px; }
.hbar { height: 10px; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
.muted { color: var(--muted); } .sec { color: var(--ink-2); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--ring);
  font-size: 12px; color: var(--ink-2); margin: 0 4px 4px 0; white-space: nowrap; }
.err { color: var(--critical); font-weight: 600; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
.stack { display: flex; height: 14px; gap: 2px; margin: 4px 0 10px; }
.stack div { height: 100%; } .stack div:first-child { border-radius: 4px 0 0 4px; } .stack div:last-child { border-radius: 0 4px 4px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
/* waterfall */
.wf { position: relative; }
.wf-row { display: grid; grid-template-columns: 200px 1fr; align-items: center; min-height: 40px; border-bottom: 1px solid var(--grid); }
.wf-row.sub .wf-label { padding-left: 14px; }
.wf-label { font-size: 12.5px; padding-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; }
.wf-label .muted { font-size: 11.5px; }
.wf-track { position: relative; height: 40px; border-left: 1px solid var(--axis); overflow: hidden; }
.wf-bar { position: absolute; top: 8px; height: 24px; border-radius: 4px; cursor: pointer; min-width: 4px;
  background: color-mix(in srgb, var(--ink) 8%, transparent); box-shadow: inset 0 0 0 1px var(--ring); }
.wf-bar:hover { background: color-mix(in srgb, var(--ink) 14%, transparent); }
.wf-call { position: absolute; top: 11px; height: 18px; min-width: 3px; border-radius: 2px;
  box-shadow: 0 0 0 1px var(--surface); cursor: pointer; z-index: 1; }
.wf-call.e { outline: 2px solid var(--critical); outline-offset: 0; }
.wf-call:hover, .wf-call.sel { box-shadow: 0 0 0 2px var(--ink); z-index: 2; }
.wf-spawn { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--muted); z-index: 0; }
.wf-axis { display: grid; grid-template-columns: 200px 1fr; font-size: 11px; color: var(--muted); }
.wf-ticks { position: relative; height: 18px; border-top: 1px solid var(--axis); }
.wf-ticks span { position: absolute; top: 3px; transform: translateX(-50%); white-space: nowrap; }
.wf-ticks span:first-child { transform: none; }
.wf-ticks span:last-child:not(:first-child) { transform: translateX(-100%); }
.wf-gap { position: absolute; top: 0; bottom: 0; width: 3%; display: grid; place-items: center; color: var(--muted);
  font-size: 11px; background: repeating-linear-gradient(135deg, transparent 0 3px, var(--grid) 3px 4px); }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; max-width: 420px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.18); display: none; overflow-wrap: anywhere; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
select, input[type="search"] { font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--ring); border-radius: 8px; padding: 5px 8px; }
input[type="search"] { min-width: 220px; flex: 1; max-width: 360px; }
pre.input { margin: 0; padding: 10px; background: var(--page); border-radius: 8px; white-space: pre-wrap;
  overflow-wrap: anywhere; max-height: 320px; overflow: auto; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.toggle { border: 1px solid var(--ring); background: transparent; color: var(--ink-2); border-radius: 8px;
  padding: 5px 9px; cursor: pointer; font: inherit; }
@media (max-width: 640px) {
  .wf-row, .wf-axis { grid-template-columns: 110px 1fr; }
  td.barcell, th.barcell, .hide-sm { display: none; }
  td.t { max-width: 42vw; }
}
</style>
</head>
<body>
<header><div class="bar">
  <span class="brand">Token Ledger</span>
  <nav class="crumbs" id="crumbs"></nav>
  <span class="spacer"></span>
  <div class="seg" id="windows" role="group" aria-label="Time window"></div>
  <span class="live" title="Refreshes whenever a transcript changes"><span class="dot" id="dot"></span><span id="ago">live</span></span>
  <button class="toggle" id="theme" aria-label="Toggle dark mode">◐</button>
</div></header>
<main id="main"><div class="empty">Loading…</div></main>
<div class="tip" id="tip" role="tooltip"></div>

<script>
const WINDOWS = [[24, '24h'], [72, '3d'], [168, '7d'], [720, '30d']]
// Tool families in fixed categorical order; everything else folds into "other".
const FAMILIES = [
  ['read', 'var(--s1)', ['Read', 'Grep', 'Glob', 'LS', 'NotebookRead']],
  ['write', 'var(--s2)', ['Edit', 'Write', 'MultiEdit', 'NotebookEdit']],
  ['shell', 'var(--s3)', ['Bash', 'BashOutput', 'KillShell', 'Monitor']],
  ['agent', 'var(--s4)', ['Agent', 'Task', 'SendMessage']],
  ['skill', 'var(--s5)', ['Skill', 'ToolSearch']],
  ['web', 'var(--s7)', ['WebFetch', 'WebSearch']],
]
const family = tool => {
  if (tool.startsWith('mcp__')) return ['mcp', 'var(--s7)']
  const f = FAMILIES.find(([, , tools]) => tools.includes(tool))
  return f ? [f[0], f[1]] : ['other', 'var(--other)']
}

const store = {
  get: k => { try { return localStorage.getItem(k) } catch { return null } },
  set: (k, v) => { try { localStorage.setItem(k, v) } catch {} },
}
let hours = Number(store.get('hours')) || 24
let sort = { key: 'cost', dir: -1 }
let callFilter = { agent: '', tool: '', q: '' }
let openCall = null
let current = null // the data the page shows now
let lastStamp = 0
let toTop = false
let layout = store.get('layout') === 'grid' ? 'grid' : 'list'
let zoom = false // timeline narrowed to the subagents' span

const $ = s => document.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const tok = n => n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n)
const usd = n => '$' + n.toFixed(n > 0 && n < 0.1 ? 3 : 2)
const dur = s => s < 1 ? Math.round(s * 1000) + 'ms' : s < 60 ? s.toFixed(s < 10 ? 1 : 0) + 's' : s < 3600 ? Math.round(s / 60) + 'm' : Math.floor(s / 3600) + 'h ' + Math.round((s % 3600) / 60) + 'm'
const ago = t => { const s = Date.now() / 1000 - t; return s < 90 ? 'just now' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago' }
const when = t => new Date(t * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })

function route() {
  const m = location.hash.match(/^#\/p\/([^/]+)(?:\/s\/([^/]+)\/([^/]+))?/)
  return m ? { project: decodeURIComponent(m[1]), dir: m[2] && decodeURIComponent(m[2]), sid: m[3] && decodeURIComponent(m[3]) } : {}
}

async function api(path) {
  const r = await fetch(path)
  const body = await r.json()
  if (!r.ok) throw new Error(body.error || r.statusText)
  return body
}

async function load() {
  const { project, dir, sid } = route()
  try {
    current = sid
      ? { kind: 'session', dir, data: await api(`/api/session?dir=${encodeURIComponent(dir)}&sid=${encodeURIComponent(sid)}`) }
      : project
        ? { kind: 'sessions', project, data: await api(`/api/sessions?project=${encodeURIComponent(project)}&h=${hours}`) }
        : { kind: 'projects', data: await api(`/api/projects?h=${hours}`) }
    if (current.kind === 'projects') for (const p of current.data) iconOf[p.key] = p.icon
    render()
  } catch (err) {
    $('#main').innerHTML = `<div class="card err">${esc(err.message)}</div>`
  }
}

function crumbs() {
  const { project, sid } = route()
  const name = project && project.replace(/^dir:/, '').split('/').pop()
  const parts = [`<a href="#/">All projects</a>`]
  if (project) parts.push('›', avatar(project, name, 18) + ' ' + (sid ? `<a href="#/p/${encodeURIComponent(project)}">${esc(name)}</a>` : `<span class="cur">${esc(name)}</span>`))
  if (sid) parts.push('›', `<span class="cur">${esc(current?.data?.title || sid)}</span>`)
  $('#crumbs').innerHTML = parts.join(' ')
  $('#windows').style.visibility = sid ? 'hidden' : 'visible'
}

function tiles(items) {
  return `<div class="tiles">${items.map(([k, v, s]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`).join('')}</div>`
}

function sortRows(rows, get) {
  return [...rows].sort((a, b) => {
    const x = get(a, sort.key), y = get(b, sort.key)
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sort.dir
  })
}
const th = (key, label, cls = '') => `<th class="sort ${cls}" data-sort="${key}" aria-sort="${sort.key === key ? (sort.dir < 0 ? 'descending' : 'ascending') : 'none'}">${label}${sort.key === key ? (sort.dir < 0 ? ' ↓' : ' ↑') : ''}</th>`

function renderProjects(list) {
  const total = list.reduce((a, p) => ({ cost: a.cost + p.usage.cost, tok: a.tok + p.usage.total, s: a.s + p.sessions, out: a.out + p.usage.output }), { cost: 0, tok: 0, s: 0, out: 0 })
  const get = (p, k) => k === 'name' ? p.name : k === 'sessions' ? p.sessions : k === 'last' ? p.last : p.usage[k]
  const rows = sortRows(list, get)
  const label = WINDOWS.find(w => w[0] === hours)[1]
  return tiles([
    ['Cost · ' + label, usd(total.cost), 'at API list prices'],
    ['Tokens', tok(total.tok), tok(total.out) + ' output'],
    ['Sessions', total.s, list.length + ' projects'],
    ['Avg per session', total.s ? usd(total.cost / total.s) : '–', ''],
  ]) + `<div class="card"><div class="cardhead"><h2>Projects</h2><span class="spacer"></span>
    ${layout === 'grid' ? `<select id="grid-sort" aria-label="Sort projects">${[['cost', 'Cost'], ['total', 'Tokens'], ['last', 'Last active'], ['sessions', 'Sessions'], ['name', 'Name']]
      .map(([k, l]) => `<option value="${k}"${sort.key === k ? ' selected' : ''}>Sort: ${l}</option>`).join('')}</select>` : ''}
    <div class="seg" role="group" aria-label="Layout"><button data-layout="list" aria-pressed="${layout === 'list'}">List</button><button data-layout="grid" aria-pressed="${layout === 'grid'}">Grid</button></div></div>
    ${!list.length ? `<div class="empty">No activity in the last ${label}.</div>` : layout === 'grid' ? `<div class="pgrid">${rows.map(p => `
      <a class="pcard" href="#/p/${encodeURIComponent(p.key)}" title="${esc(p.cwd)}">
        ${avatar(p.key, p.name, 36, p.icon)}
        <div class="pname" style="margin-top:10px"><strong>${esc(p.name)}</strong>${p.isGit ? ` <span class="chip">git${p.folders > 1 ? ` · ${p.folders} worktrees` : ''}</span>` : ''}</div>
        <div class="muted pcwd">${esc(p.cwd)}</div>
        <div class="pcost">${usd(p.usage.cost)}</div>
        <div class="pstats"><span><span class="muted">tokens</span> ${tok(p.usage.total)}</span><span><span class="muted">output</span> ${tok(p.usage.output)}</span>
          <span><span class="muted">sessions</span> ${p.sessions}</span><span><span class="muted">active</span> ${ago(p.last)}</span></div>
      </a>`).join('')}</div>` : `<div class="scroll"><table>
    <thead><tr>${th('name', 'Project')}${th('sessions', 'Sessions', 'n')}${th('last', 'Last active', 'n hide-sm')}${th('input', 'Input', 'n hide-sm')}${th('output', 'Output', 'n')}${th('cacheRead', 'Cache read', 'n hide-sm')}${th('total', 'Tokens', 'n')}${th('cost', 'Cost', 'n')}</tr></thead>
    <tbody>${rows.map(p => `<tr class="click" tabindex="0" data-href="#/p/${encodeURIComponent(p.key)}">
      <td class="t" title="${esc(p.cwd)}">${avatar(p.key, p.name, 22, p.icon)} <strong>${esc(p.name)}</strong>${p.isGit ? ` <span class="chip" title="git repository">git${p.folders > 1 ? ` · ${p.folders} worktrees` : ''}</span>` : ''} <span class="muted hide-sm">${esc(p.cwd)}</span></td>
      <td class="n">${p.sessions}</td><td class="n sec hide-sm">${ago(p.last)}</td>
      <td class="n hide-sm">${tok(p.usage.input + p.usage.cacheWrite)}</td><td class="n">${tok(p.usage.output)}</td>
      <td class="n hide-sm">${tok(p.usage.cacheRead)}</td><td class="n">${tok(p.usage.total)}</td>
      <td class="n"><strong>${usd(p.usage.cost)}</strong></td></tr>`).join('')}</tbody></table></div>`}</div>`
}

function renderSessions(list) {
  const cost = list.reduce((a, s) => a + s.usage.cost, 0)
  const tools = list.reduce((a, s) => a + s.tools, 0)
  const get = (s, k) => k === 'title' ? s.title : k === 'end' ? s.end : k === 'tools' ? s.tools : s.usage[k]
  const rows = sortRows(list, get)
  const root = route().project.replace(/^dir:/, '')
  return `<div class="title" style="display:flex;gap:14px;align-items:center">${avatar(route().project, root.split('/').pop(), 48)}<div><h1>${esc(root.split('/').pop())}</h1><div class="sub mono">${esc(root)}${route().project.startsWith('dir:') ? '' : ' · git'}</div></div></div>` +
    tiles([
      ['Cost · ' + WINDOWS.find(w => w[0] === hours)[1], usd(cost), ''],
      ['Tokens', tok(list.reduce((a, s) => a + s.usage.total, 0)), ''],
      ['Sessions', list.length, ''],
      ['Tool calls', tools, ''],
    ]) + `<div class="card"><h2>Sessions</h2>${list.length ? `<div class="scroll"><table>
    <thead><tr>${th('end', 'Last active')}${th('title', 'Session')}<th class="hide-sm">Model</th>${th('tools', 'Tools', 'n')}${th('total', 'Tokens', 'n')}${th('cost', 'Cost', 'n')}</tr></thead>
    <tbody>${rows.map(s => `<tr class="click" tabindex="0" data-href="#/p/${encodeURIComponent(route().project)}/s/${encodeURIComponent(s.dir)}/${encodeURIComponent(s.id)}">
      <td class="sec" title="${when(s.end)}">${ago(s.end)}</td>
      <td class="t"><strong>${esc(s.title || s.id)}</strong>${s.branch ? ` <span class="chip">${esc(s.branch)}</span>` : ''}${s.cwd && s.cwd !== root ? ` <span class="muted hide-sm" title="${esc(s.cwd)}">${esc(s.cwd.split('/').pop())}</span>` : ''}</td>
      <td class="sec mono hide-sm">${esc((s.models[0] || '').replace('claude-', ''))}</td>
      <td class="n">${s.tools}</td><td class="n">${tok(s.usage.total)}</td><td class="n"><strong>${usd(s.usage.cost)}</strong></td></tr>`).join('')}</tbody></table></div>`
    : `<div class="empty">No sessions in this window.</div>`}</div>`
}

// Active stretches keep their real proportions; idle gaps over IDLE collapse to a fixed sliver,
// so a session resumed days later still shows its work.
const IDLE = 300
function timeMap(s, [from, to] = [s.start, s.end]) {
  const ts = s.calls.flatMap(c => [c.ts, c.ts + c.ms / 1000]).concat(s.agents.flatMap(a => [a.start, a.end]), [from, to]).filter(t => t && t >= from && t <= to).sort((a, b) => a - b)
  const segs = [[ts[0], ts[0]]]
  for (const t of ts) { const last = segs[segs.length - 1]; if (t - last[1] > IDLE) segs.push([t, t]); else last[1] = t }
  const GAP = 3 // % width per collapsed gap
  const active = segs.reduce((a, [x, y]) => a + Math.max(y - x, 1), 0)
  const room = 100 - GAP * (segs.length - 1)
  let at = 0
  const placed = segs.map(([x, y], i) => { const w = (Math.max(y - x, 1) / active) * room; const p = { x, y, left: at, w }; at += w + GAP; return p })
  const pct = t => {
    for (let i = 0; i < placed.length; i++) {
      const p = placed[i]
      if (t <= p.y || i === placed.length - 1) return t < p.x ? (i ? p.left - GAP / 2 : -100) : p.left + Math.min(1, (t - p.x) / Math.max(p.y - p.x, 1)) * p.w
    }
  }
  return { pct, placed }
}

// Most subagents running at the same moment: sweep over start/end events.
function maxParallel(agents) {
  const ev = agents.flatMap(a => [[a.start, 1], [a.end, -1]]).sort((x, y) => x[0] - y[0] || x[1] - y[1])
  let now = 0, peak = 0
  for (const [, d] of ev) peak = Math.max(peak, (now += d))
  return peak
}

function waterfall(s) {
  const subs = s.agents.filter(a => a.id !== 'main')
  const range = zoom && subs.length ? (([a, b]) => [a - (b - a) * 0.05, b + (b - a) * 0.05])([Math.min(...subs.map(a => a.start)), Math.max(...subs.map(a => a.end))]) : [s.start, s.end]
  const t0 = s.start
  const { pct, placed } = timeMap(s, range)
  // a label at each stretch's start, more inside wide ones
  const ticks = placed.flatMap((p, i) => [0, 0.25, 0.5, 0.75].filter(f => f === 0 || p.w > 30).map(f =>
    `<span style="left:${p.left + f * p.w}%">${i || f || zoom ? '+' + dur(p.x + f * (p.y - p.x) - t0) : when(t0)}</span>`)).join('')
  const gaps = placed.slice(1).map((p, i) => `<div class="wf-gap" style="left:${p.left - 3}%" title="idle ${dur(p.x - placed[i].y)}">⋯</div>`).join('')
  // main first, then subagents in the order they started: overlapping bars ran in parallel
  const agents = [s.agents.find(a => a.id === 'main'), ...s.agents.filter(a => a.id !== 'main').sort((a, b) => a.start - b.start)].filter(Boolean)
  const lanes = agents.map(a => {
    const calls = s.calls.filter(c => c.agent === a.id)
    const spawn = a.toolUseId && s.calls.find(c => c.id === a.toolUseId)
    return `<div class="wf-row${a.id === 'main' ? '' : ' sub'}"><div class="wf-label" title="${esc(a.description)}">${a.id === 'main' ? '<strong>main</strong>' : `${esc(a.type)} <span class="muted">${esc(a.description)}</span>`}<br><span class="muted">${esc(short(a.models))} · ${dur(a.end - a.start)} · ${usd(a.usage.cost)} · ${a.tools} tools</span></div>
      <div class="wf-track">${gaps}${spawn ? `<div class="wf-spawn" style="left:${pct(spawn.ts)}%"></div>` : ''}
      <div class="wf-bar" data-agent="${esc(a.id)}" style="left:${pct(a.start)}%;width:${Math.max(0.3, pct(a.end) - pct(a.start))}%"></div>
      ${calls.map(c => `<div class="wf-call${c.error ? ' e' : ''}${openCall === c.id ? ' sel' : ''}" data-call="${esc(c.id)}" style="left:${pct(c.ts)}%;width:${Math.max(0.25, pct(c.ts + c.ms / 1000) - pct(c.ts))}%;background:${family(c.tool)[1]}"></div>`).join('')}
      </div></div>`
  }).join('')
  const peak = maxParallel(agents.filter(a => a.id !== 'main'))
  const used = [...new Set(s.calls.map(c => family(c.tool)[0]))]
  const legend = [...FAMILIES.map(f => [f[0], f[1]]), ['mcp', 'var(--s7)'], ['other', 'var(--other)']]
    .filter(([n]) => used.includes(n)).map(([n, c]) => `<span><span class="sw" style="background:${c}"></span>${n}</span>`).join('')
  return `<div class="card"><div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap"><h2>Timeline · ${agents.length - 1} subagent${agents.length === 2 ? '' : 's'}${peak > 1 ? ` · up to ${peak} in parallel` : ''}</h2>${subs.length ? `<button class="toggle" id="zoom" aria-pressed="${zoom}">${zoom ? 'Show whole session' : 'Zoom to subagents'}</button>` : ''}</div>
    <div class="legend" style="margin-bottom:10px">${legend}${s.errors ? `<span><span class="sw" style="outline:2px solid var(--critical);background:transparent"></span>error</span>` : ''}</div>
    <div class="scroll"><div class="wf" style="min-width:560px">${lanes}<div class="wf-axis"><span></span><div class="wf-ticks">${ticks}</div></div></div></div></div>`
}

function callsTable(s) {
  const agentName = id => id === 'main' ? 'main' : (s.agents.find(a => a.id === id)?.type || id)
  const q = callFilter.q.toLowerCase()
  const shown = s.calls.filter(c => (!callFilter.agent || c.agent === callFilter.agent) && (!callFilter.tool || c.tool === callFilter.tool)
    && (!q || (c.target + ' ' + c.input + ' ' + c.tool).toLowerCase().includes(q)))
  if (callFilter.byCost) shown.sort((a, b) => b.cost - a.cost)
  const LIMIT = 500
  const opt = (v, l, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`
  return `<div class="card"><h2>Tool calls · ${shown.length} of ${s.calls.length}</h2>
    <div class="filters">
      <select id="f-agent" aria-label="Agent">${opt('', 'All agents', callFilter.agent)}${s.agents.map(a => opt(a.id, a.id === 'main' ? 'main' : a.type + ' · ' + a.id.slice(0, 6), callFilter.agent)).join('')}</select>
      <select id="f-tool" aria-label="Tool">${opt('', 'All tools', callFilter.tool)}${s.toolCounts.map(([t, n]) => opt(t, `${t} (${n})`, callFilter.tool)).join('')}</select>
      <input type="search" id="f-q" placeholder="Search inputs…" value="${esc(callFilter.q)}" aria-label="Search tool inputs">
      <div class="seg" role="group" aria-label="Order"><button data-order="time" aria-pressed="${!callFilter.byCost}">By time</button><button data-order="cost" aria-pressed="${!!callFilter.byCost}">Most expensive</button></div>
    </div>
    <div class="scroll"><table><thead><tr><th class="n">At</th><th>Agent</th><th>Tool</th><th>Target</th><th class="n">Took</th><th class="n">Tokens</th><th class="n">Cost</th></tr></thead><tbody>
    ${shown.slice(0, LIMIT).map(c => `<tr class="click${openCall === c.id ? ' sel' : ''}" tabindex="0" data-open="${esc(c.id)}" id="call-${esc(c.id)}">
      <td class="n sec mono">+${dur(c.ts - s.start)}</td>
      <td class="sec">${esc(agentName(c.agent))}</td>
      <td><span class="sw" style="background:${family(c.tool)[1]}"></span><span class="${c.error ? 'err' : ''}">${esc(c.tool)}${c.error ? ' ✕' : ''}</span></td>
      <td class="t mono">${c.subagent ? `→ <strong>${esc(c.subagent)}</strong> ` : ''}${esc(c.target)}</td>
      <td class="n sec">${c.ms ? dur(c.ms / 1000) : '–'}</td>
      <td class="n sec" title="written ${tok(c.outTok)} · result ${tok(c.resultTok)} · re-read ${tok(c.carryTok)}">${tok(c.outTok + c.resultTok)}</td>
      <td class="n">${usd(c.cost)}</td></tr>
      ${openCall === c.id ? `<tr><td colspan="7"><div class="legend" style="margin-bottom:8px">
        <span>written <strong class="num">${tok(c.outTok)}</strong> output tokens</span>
        <span>result <strong class="num">${tok(c.resultTok)}</strong> tokens into context</span>
        <span>re-read <strong class="num">${tok(c.carryTok)}</strong> tokens from cache afterwards</span>
        <span>≈ <strong class="num">${usd(c.cost)}</strong></span></div>
        <pre class="input mono">${esc(pretty(c.input))}</pre></td></tr>` : ''}`).join('')}
    </tbody></table>${shown.length > LIMIT ? `<div class="empty">Showing the first ${LIMIT}; narrow the filters to see the rest.</div>` : ''}</div></div>`
}
const short = models => (models || []).map(m => m.replace(/^claude-/, '')).join(', ') || '–'
// Project badge: its own icon when it has one, else initials on a colour fixed by its name.
const MONO = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s7']
const initials = name => {
  const words = name.match(/[A-Za-z0-9]+/g) || ['?']
  const lettered = words.filter(w => /^[A-Za-z]/.test(w)) // skip dates and hashes
  return (lettered.length ? lettered : words).slice(0, 2).map(w => w[0]).join('').toUpperCase()
}
function monogram(name, size) {
  let h = 0
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0
  const c = `var(${MONO[h % MONO.length]})`
  return `<span class="avatar mono" style="--sz:${size}px;background:color-mix(in srgb, ${c} 22%, var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb, ${c} 45%, transparent)" aria-hidden="true">${esc(initials(name))}</span>`
}
// icon: true / false when known, undefined to try and fall back
const iconOf = {} // project key -> has an icon, as the server said or a failed load showed
function avatar(key, name, size, icon = iconOf[key]) {
  if (icon === false) return monogram(name, size)
  return `<span class="avatar" style="--sz:${size}px" aria-hidden="true"><img src="/api/icon?project=${encodeURIComponent(key)}" alt="" loading="lazy"
    onerror="iconOf[decodeURIComponent(this.src.split('project=')[1])] = false; this.parentNode.outerHTML = this.parentNode.dataset.fallback" ></span>`.replace('<span class="avatar"', `<span class="avatar" data-fallback="${esc(monogram(name, size))}"`)
}
const pretty = s => { try { return JSON.stringify(JSON.parse(s), null, 2) } catch { return s } }

// The session's cost split into what caused it; the parts add up to the total.
const PART_COLORS = { tools: 'var(--s3)', subagents: 'var(--s4)', start: 'var(--s1)', user: 'var(--s5)', reply: 'var(--s7)', compact: 'var(--other)' }
function whereCost(s) {
  const total = s.usage.cost || 1
  return `<div class="card"><h2>Where the cost went · ${usd(s.usage.cost)}</h2>
    <div class="stack" style="height:18px" role="img" aria-label="Cost split">${s.breakdown.map(b => `<div title="${esc(b.label)}: ${usd(b.cost)}" style="flex:${b.cost};background:${PART_COLORS[b.key]}"></div>`).join('')}</div>
    <table><tbody>${s.breakdown.map(b => `<tr>
      <td style="width:1%"><span class="sw" style="background:${PART_COLORS[b.key]}"></span></td><td>${esc(b.label)}</td>
      <td class="n"><strong>${usd(b.cost)}</strong></td><td class="n sec" style="width:4em">${Math.round((b.cost / total) * 100)}%</td></tr>`).join('')}</tbody></table>
    <p class="muted" style="margin:10px 0 0;font-size:12px">Every request is billed for its whole context. Each part is charged for the requests it was in: once when it was added (cache write), then on every later request (cache read).</p></div>`
}

function renderSession(s) {
  const u = s.usage
  const parts = [['input', u.input, 'var(--seq-in)'], ['output', u.output, 'var(--seq-out)'], ['cache write', u.cacheWrite, 'var(--seq-cw)'], ['cache read', u.cacheRead, 'var(--seq-cr)']]
  const maxTool = s.toolStats[0]?.cost || 0
  const subs = s.agents.filter(a => a.id !== 'main')
  return `<div class="title"><h1>${esc(s.title || s.id)}</h1>
      <div class="sub"><span class="mono">${esc(s.cwd)}</span>${s.branch ? ` <span class="chip">${esc(s.branch)}</span>` : ''} · ${when(s.start)} · <span class="mono muted">${esc(s.id)}</span></div>
      ${s.prompt ? `<blockquote>${esc(s.prompt)}</blockquote>` : ''}</div>` +
    tiles([
      ['Cost', usd(u.cost), u.requests + ' requests'],
      ['Tokens', tok(u.total), tok(u.output) + ' output'],
      ['Duration', dur(s.end - s.start), ''],
      ['Tool calls', s.calls.length, s.errors ? `<span class="err">${s.errors} failed</span>` : 'none failed'],
      ['Subagents', subs.length, subs.length ? usd(subs.reduce((a, x) => a + x.usage.cost, 0)) : ''],
      ['Skills', s.skills.length, s.skills.map(k => k[0]).slice(0, 3).join(', ')],
    ]) +
    waterfall(s) + whereCost(s) +
    `<div class="grid2">
      <div class="card"><h2>Tokens</h2>
        <div class="stack" role="img" aria-label="Token split">${parts.filter(p => p[1]).map(([n, v, c]) => `<div title="${n}: ${tok(v)}" style="flex:${v};background:${c}"></div>`).join('')}</div>
        <div class="legend">${parts.map(([n, v, c]) => `<span><span class="sw" style="background:${c}"></span>${n} <strong class="num">${tok(v)}</strong></span>`).join('')}</div>
        <table style="margin-top:12px"><thead><tr><th>Model</th><th class="n">Requests</th><th class="n">Tokens</th><th class="n">Cost</th></tr></thead><tbody>
        ${s.models.map(m => `<tr><td class="mono">${esc(m.model)}</td><td class="n">${m.requests}</td><td class="n">${tok(m.total)}</td><td class="n"><strong>${usd(m.cost)}</strong></td></tr>`).join('')}
        </tbody></table></div>
      <div class="card"><h2>Cost by tool · all agents · ${usd(s.toolCost)}</h2>
        <p class="muted" style="margin:-6px 0 10px;font-size:12px">Writing the call, reading its result, and re-reading both from cache on every later request.</p>
        <table><thead><tr><th>Tool</th><th class="n">Calls</th><th class="n hide-sm">Result</th><th class="n hide-sm">Re-read</th><th class="n">Cost</th><th class="n hide-sm">Avg</th><th class="barcell"></th></tr></thead><tbody>
        ${s.toolStats.map(st => `<tr class="click" tabindex="0" data-tool="${esc(st.tool)}"><td style="max-width:0;width:32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(st.tool)}"><span class="sw" style="background:${family(st.tool)[1]}"></span>${esc(st.tool.replace(/^mcp__(claude_ai_)?/, ''))}</td>
          <td class="n">${st.n}</td><td class="n sec hide-sm">${tok(st.resultTok)}</td><td class="n sec hide-sm">${tok(st.carryTok)}</td>
          <td class="n"><strong>${usd(st.cost)}</strong></td><td class="n sec hide-sm">${usd(st.cost / st.n)}</td>
          <td class="barcell"><div class="hbar" style="width:${maxTool ? (st.cost / maxTool) * 100 : 0}%;background:${family(st.tool)[1]}"></div></td></tr>`).join('')}
        </tbody></table></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>Subagents · ${subs.length}</h2>${subs.length ? `<div class="scroll"><table><thead><tr><th>Type</th><th>Task</th><th>Model</th><th class="n">Tools</th><th class="n">Took</th><th class="n">Cost</th></tr></thead><tbody>
        ${subs.map(a => `<tr class="click" tabindex="0" data-agent="${esc(a.id)}"><td><strong>${esc(a.type)}</strong></td><td class="t sec" title="${esc(a.description)}">${esc(a.description)}</td>
          <td class="sec mono">${esc(short(a.models))}</td><td class="n">${a.tools}</td><td class="n sec">${dur(a.end - a.start)}</td><td class="n"><strong>${usd(a.usage.cost)}</strong></td></tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">No subagents in this session.</div>'}</div>
      <div class="card"><h2>Skills · ${s.skills.length}</h2>${s.skills.length ? s.skills.map(([k, n]) => `<span class="chip">${esc(k)} ×${n}</span>`).join('') : '<div class="empty">No skills used.</div>'}</div>
    </div>` +
    callsTable(s)
}

function render() {
  crumbs()
  const y = scrollY
  $('#main').innerHTML = current.kind === 'projects' ? renderProjects(current.data)
    : current.kind === 'sessions' ? renderSessions(current.data) : renderSession(current.data)
  scrollTo(0, toTop ? 0 : y) // live refreshes keep your place; navigation starts at the top
  toTop = false
  const f = $('#f-q')
  if (f && document.activeElement?.id !== 'f-q' && callFilter.focus) { f.focus(); f.setSelectionRange(f.value.length, f.value.length) }
}

function renderWindows() {
  $('#windows').innerHTML = WINDOWS.map(([h, l]) => `<button data-h="${h}" aria-pressed="${h === hours}">${l}</button>`).join('')
}

// --- events
document.addEventListener('click', e => {
  const t = e.target.closest('[data-h],[data-sort],[data-href],[data-open],[data-call],[data-tool],[data-agent],[data-order],[data-layout],#theme,#zoom')
  if (!t) return
  if (t.id === 'zoom') { zoom = !zoom; return render() }
  if (t.dataset.layout) { layout = t.dataset.layout; store.set('layout', layout); return render() }
  if (t.dataset.order) { callFilter.byCost = t.dataset.order === 'cost'; return render() }
  if (t.id === 'theme') {
    const dark = getComputedStyle(document.documentElement).colorScheme === 'dark'
    document.documentElement.dataset.theme = dark ? 'light' : 'dark'
    return store.set('theme', document.documentElement.dataset.theme)
  }
  if (t.dataset.h) { hours = Number(t.dataset.h); store.set('hours', hours); renderWindows(); return load() }
  if (t.dataset.sort) { sort = { key: t.dataset.sort, dir: sort.key === t.dataset.sort ? -sort.dir : -1 }; return render() }
  if (t.dataset.href) { location.hash = t.dataset.href; return }
  if (t.dataset.tool) { callFilter.tool = t.dataset.tool; render(); return $('#f-tool').scrollIntoView({ block: 'center' }) }
  if (t.dataset.agent) { callFilter.agent = t.dataset.agent; render(); return $('#f-agent').scrollIntoView({ block: 'center' }) }
  const id = t.dataset.open || t.dataset.call
  openCall = openCall === id ? null : id
  if (t.dataset.call) { callFilter = { agent: '', tool: '', q: '' } }
  render()
  if (t.dataset.call) document.getElementById('call-' + id)?.scrollIntoView({ block: 'center', behavior: 'smooth' })
})
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('tr.click')) e.target.click()
})
document.addEventListener('change', e => {
  if (e.target.id === 'f-agent') callFilter.agent = e.target.value
  if (e.target.id === 'f-tool') callFilter.tool = e.target.value
  if (e.target.id === 'grid-sort') { sort = { key: e.target.value, dir: e.target.value === 'name' ? 1 : -1 }; return render() }
  if (e.target.id.startsWith('f-')) render()
})
document.addEventListener('input', e => {
  if (e.target.id === 'f-q') { callFilter.q = e.target.value; callFilter.focus = true; render() }
})
document.addEventListener('focusout', e => { if (e.target.id === 'f-q') callFilter.focus = false })
// tooltip over waterfall blocks
document.addEventListener('mousemove', e => {
  const c = e.target.closest('.wf-call, .wf-bar'), tip = $('#tip')
  if (!c || current?.kind !== 'session') return (tip.style.display = 'none')
  const s = current.data, call = s.calls.find(x => x.id === c.dataset.call)
  const agent = s.agents.find(a => a.id === (call ? call.agent : c.dataset.agent))
  const who = agent.id === 'main' ? 'main' : agent.type
  tip.innerHTML = !call ? `<strong>${esc(who)}</strong> <span class="muted">· ${esc(short(agent.models))} · ${dur(agent.end - agent.start)} · ${usd(agent.usage.cost)} · ${agent.tools} tools</span>${agent.description ? `<br>${esc(agent.description)}` : ''}
    <br><span class="muted">+${dur(agent.start - s.start)} → +${dur(agent.end - s.start)} · click to filter its tool calls</span>` : `<strong>${esc(call.tool)}</strong>${call.error ? ' <span class="err">failed</span>' : ''} <span class="muted">· ${esc(who)}</span><br>
    <span class="mono">${esc(call.target || '')}</span><br><span class="muted">+${dur(call.ts - s.start)} · took ${call.ms ? dur(call.ms / 1000) : '–'} · ${tok(call.outTok + call.resultTok)} tokens · ${usd(call.cost)}</span>`
  tip.style.display = 'block'
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)
  const y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16
  tip.style.left = x + 'px'; tip.style.top = y + 'px'
})
addEventListener('hashchange', () => { toTop = true; zoom = false; openCall = null; callFilter = { agent: '', tool: '', q: '' }; sort = { key: route().project ? 'end' : 'cost', dir: -1 }; load() })

// live: re-fetch when any transcript was written (each tool call, each reply)
async function poll() {
  try {
    const { stamp } = await api('/api/stamp')
    $('#dot').classList.remove('off')
    if (stamp !== lastStamp) {
      const first = lastStamp === 0
      lastStamp = stamp
      if (!first) { await load(); const d = $('#dot'); d.classList.remove('pulse'); void d.offsetWidth; d.classList.add('pulse') }
    }
    $('#ago').textContent = 'live · ' + ago(stamp)
  } catch {
    $('#dot').classList.add('off'); $('#ago').textContent = 'server stopped'
  }
}

if (store.get('theme')) document.documentElement.dataset.theme = store.get('theme')
if (!WINDOWS.some(w => w[0] === hours)) hours = 24
sort = { key: route().project ? 'end' : 'cost', dir: -1 }
renderWindows()
